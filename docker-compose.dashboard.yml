# RootRouter dashboard — VPS / self-host
#
#   cp deploy/dashboard.env.example deploy/dashboard.env   # edit CONVEX URL
#   docker compose -f docker-compose.dashboard.yml up -d --build
#
# Caddy on host (see deploy/caddy/rootrouter.caddy) → rootrouter-dashboard:3000

services:
  rootrouter-dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-}
    image: rootrouter-dashboard:local
    container_name: rootrouter-dashboard
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - openclaw

networks:
  openclaw:
    external: true
    name: ${ROOTROUTER_DOCKER_NETWORK:-openclaw_default}
